spring.application.name=cse-intellilearn-api
server.port=8080

# H2 Database Configuration (Ideal for local development & testing)
spring.datasource.url=jdbc:h2:mem:cse_intellilearn_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=CSEIntelliLearnSecretKeyForJWTAuthentication2026SecureKeyWithMin256BitsLength!
app.jwt.expiration-ms=86400000
