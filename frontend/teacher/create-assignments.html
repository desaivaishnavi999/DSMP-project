<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Assignment - CSE IntelliLearn</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8ff;
            color: #1e293b;
        }

        header {
            background: #4f7cff;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        .back-btn {
            background: white;
            color: #4f7cff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h2 {
            color: #2563eb;
            margin-bottom: 8px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #334155;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #4f7cff;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #4f7cff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #365fd9;
        }

        .success {
            display: none;
            margin-top: 20px;
            padding: 14px;
            background: #dcfce7;
            color: #166534;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            header {
                padding: 15px 20px;
            }

            header h1 {
                font-size: 20px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .form-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>CSE IntelliLearn</h1>

    <button class="back-btn" onclick="goBack()">
        ← Back
    </button>
</header>


<div class="container">

    <div class="title">
        <h2>Create Assignment</h2>
        <p>Create and publish an assignment for students</p>
    </div>


    <div class="form-card">

        <form id="assignmentForm">

            <!-- Assignment Title -->
            <div class="form-group">
                <label>Assignment Title</label>
                <input
                    type="text"
                    id="title"
                    placeholder="Enter assignment title"
                    required
                >
            </div>


            <!-- Subject + Semester -->
            <div class="row">

                <div class="form-group">
                    <label>Subject</label>

                    <select id="subject" required>
                        <option value="">Select Subject</option>

                        <option>Physics</option>
                        <option>Graphics</option>
                        <option>Engineering Mathematics-I</option>
                        <option>Basic Civil Engineering</option>
                        <option>Basic Electrical Engineering</option>

                        <option>Engineering Chemistry</option>
                        <option>Basic Mechanical Engineering</option>
                        <option>Engineering Mechanics</option>
                        <option>Engineering Mathematics-II</option>

                        <option>Data Structure Using C</option>
                        <option>Computer Network</option>
                        <option>MDM</option>
                        <option>Discrete Mathematical Structure</option>
                        <option>OE</option>

                        <option>Automata Theory</option>
                        <option>Operating System</option>
                        <option>CPP-OOP</option>
                        <option>Soft Skill</option>
                    </select>
                </div>


                <div class="form-group">
                    <label>Semester</label>

                    <select id="semester" required>
                        <option value="">Select Semester</option>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>
                    </select>
                </div>

            </div>


            <!-- Unit + Topic -->
            <div class="row">

                <div class="form-group">
                    <label>Unit</label>

                    <select id="unit" required>
                        <option value="">Select Unit</option>
                        <option>Unit 1</option>
                        <option>Unit 2</option>
                        <option>Unit 3</option>
                        <option>Unit 4</option>
                        <option>Unit 5</option>
                        <option>Unit 6</option>
                    </select>
                </div>


                <div class="form-group">
                    <label>Topic</label>

                    <input
                        type="text"
                        id="topic"
                        placeholder="Enter topic name"
                        required
                    >
                </div>

            </div>


            <!-- Due Date -->
            <div class="form-group">
                <label>Due Date</label>

                <input
                    type="date"
                    id="dueDate"
                    required
                >
            </div>


            <!-- Instructions -->
            <div class="form-group">
                <label>Assignment Instructions</label>

                <textarea
                    id="instructions"
                    placeholder="Enter instructions for students..."
                    required
                ></textarea>
            </div>


            <button type="submit" class="submit-btn">
                Create Assignment
            </button>


            <div class="success" id="successMessage">
                ✓ Assignment created successfully!
            </div>

        </form>

    </div>

</div>


<script>

    // Read data if page is opened from View/Edit
    const params = new URLSearchParams(window.location.search);

    const titleParam = params.get("title");
    const subjectParam = params.get("subject");
    const semesterParam = params.get("semester");
    const unitParam = params.get("unit");
    const topicParam = params.get("topic");
    const dueDateParam = params.get("dueDate");


    // Prefill existing assignment
    if (titleParam) {
        document.getElementById("title").value = titleParam;
    }

    if (subjectParam) {
        document.getElementById("subject").value = subjectParam;
    }

    if (semesterParam) {
        document.getElementById("semester").value = semesterParam;
    }

    if (unitParam) {
        document.getElementById("unit").value = unitParam;
    }

    if (topicParam) {
        document.getElementById("topic").value = topicParam;
    }


    // Convert date like "05 October 2026" to input date
    if (dueDateParam) {

        const date = new Date(dueDateParam);

        if (!isNaN(date)) {

            const year = date.getFullYear();

            const month = String(
                date.getMonth() + 1
            ).padStart(2, "0");

            const day = String(
                date.getDate()
            ).padStart(2, "0");

            document.getElementById("dueDate").value =
                `${year}-${month}-${day}`;
        }
    }


    // Form submit
    document.getElementById("assignmentForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const assignment = {

                id: Date.now(),

                title:
                    document.getElementById("title").value,

                subject:
                    document.getElementById("subject").value,

                semester:
                    document.getElementById("semester").value,

                unit:
                    document.getElementById("unit").value,

                topic:
                    document.getElementById("topic").value,

                dueDate:
                    document.getElementById("dueDate").value,

                instructions:
                    document.getElementById("instructions").value
            };


            // Save frontend demo assignment
            localStorage.setItem(
                "teacherAssignment",
                JSON.stringify(assignment)
            );


            // Show success message
            document.getElementById("successMessage").style.display =
                "block";


            // Clear form after creation
            setTimeout(function() {

                document.getElementById("assignmentForm").reset();

            }, 1200);

        });


    // Back button
    function goBack() {

        window.location.href =
            "teacher-assignments.html";

    }

</script>

</body>
</html>
