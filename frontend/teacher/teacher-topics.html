<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Topics - Teacher | CSE IntelliLearn</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8ff;
            color: #1e293b;
        }

        /* Header */
        header {
            background: #4f7cff;
            color: white;
            padding: 18px 35px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        .back-btn {
            background: white;
            color: #4f7cff;
            border: none;

            padding: 10px 18px;
            border-radius: 8px;

            cursor: pointer;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #eaf0ff;
        }

        /* Main */
        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 20px;
        }

        /* Subject Info */
        .subject-info {
            background: white;
            padding: 25px;

            border-radius: 15px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.08);

            margin-bottom: 30px;
        }

        .subject-info h2 {
            color: #315dcc;
            margin-bottom: 8px;
        }

        .subject-info p {
            color: #64748b;
        }

        /* Unit */
        .unit {
            background: white;

            padding: 22px;
            margin-bottom: 20px;

            border-radius: 15px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }

        .unit-title {
            color: #315dcc;
            font-size: 20px;

            margin-bottom: 18px;
            padding-bottom: 10px;

            border-bottom: 2px solid #eaf0ff;
        }

        /* Topics */
        .topics {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(230px, 1fr));

            gap: 15px;
        }

        .topic-card {
            background: #f4f8ff;

            padding: 18px;

            border-radius: 10px;

            border: 1px solid #dbe6ff;

            transition: 0.3s;
        }

        .topic-card:hover {
            transform: translateY(-3px);

            background: #eaf0ff;
        }

        .topic-card h4 {
            color: #315dcc;

            margin-bottom: 12px;

            line-height: 1.4;
        }

        .manage-btn {
            width: 100%;

            background: #4f7cff;
            color: white;

            border: none;

            padding: 10px;

            border-radius: 7px;

            cursor: pointer;
            font-weight: bold;
        }

        .manage-btn:hover {
            background: #315dcc;
        }

        /* Error */
        .error {
            background: white;

            padding: 30px;

            text-align: center;

            border-radius: 15px;

            color: #64748b;
        }
    </style>
</head>

<body>

    <!-- Header -->

    <header>

        <h1>CSE IntelliLearn</h1>

        <button
            class="back-btn"
            onclick="goBack()">

            ← Subjects

        </button>

    </header>


    <!-- Main -->

    <div class="container">


        <!-- Subject Information -->

        <div class="subject-info">

            <h2 id="subjectName">
                Subject
            </h2>

            <p id="semesterName">
                Semester
            </p>

        </div>


        <!-- Units -->

        <div id="unitsContainer"></div>

    </div>


    <script>

        /* Get data from URL */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const subject =
            urlParams.get("subject");

        const semester =
            urlParams.get("semester");


        /* Show subject */

        document.getElementById(
            "subjectName"
        ).innerText =
            subject || "Subject";


        document.getElementById(
            "semesterName"
        ).innerText =
            "Semester " + (semester || "");


        /*
            Six Units
            Each Unit = Five Topics
        */

        const unitsContainer =
            document.getElementById(
                "unitsContainer"
            );


        if (subject) {

            for (
                let unit = 1;
                unit <= 6;
                unit++
            ) {

                const unitDiv =
                    document.createElement(
                        "div"
                    );

                unitDiv.className =
                    "unit";


                unitDiv.innerHTML = `

                    <div class="unit-title">

                        Unit ${unit}

                    </div>

                    <div
                        class="topics"
                        id="unit-${unit}">
                    </div>

                `;


                unitsContainer.appendChild(
                    unitDiv
                );


                const topicsContainer =
                    unitDiv.querySelector(
                        ".topics"
                    );


                /*
                    Five topics
                */

                for (
                    let topic = 1;
                    topic <= 5;
                    topic++
                ) {

                    const topicName =
                        "Topic " +
                        topic +
                        " - " +
                        subject;


                    const topicCard =
                        document.createElement(
                            "div"
                        );


                    topicCard.className =
                        "topic-card";


                    topicCard.innerHTML = `

                        <h4>
                            ${topicName}
                        </h4>

                        <button
                            class="manage-btn"
                            onclick="openNotes(
                                ${unit},
                                '${topicName}'
                            )">

                            Manage Topic

                        </button>

                    `;


                    topicsContainer.appendChild(
                        topicCard
                    );

                }

            }

        }

        else {

            unitsContainer.innerHTML = `

                <div class="error">

                    <h3>
                        Subject Not Found
                    </h3>

                    <p>
                        Please select a subject again.
                    </p>

                </div>

            `;

        }


        /* Open Teacher Notes */

        function openNotes(
            unit,
            topic
        ) {

            window.location.href =
                "teacher-notes.html" +

                "?subject=" +
                encodeURIComponent(subject) +

                "&semester=" +
                encodeURIComponent(semester) +

                "&unit=" +
                encodeURIComponent(unit) +

                "&topic=" +
                encodeURIComponent(topic);

        }


        /* Back to Subjects */

        function goBack() {

            window.location.href =
                "teacher-subjects.html" +
                "?semester=" +
                encodeURIComponent(semester);

        }

    </script>

</body>
</html>
