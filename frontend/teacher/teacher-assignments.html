<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assignments - Teacher | CSE IntelliLearn</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8ff;
            color: #1e293b;
        }

        /* Header */

        header {
            background: #4f7cff;
            color: white;

            padding: 18px 35px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        .back-btn {
            background: white;
            color: #4f7cff;

            border: none;

            padding: 10px 18px;

            border-radius: 8px;

            cursor: pointer;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #eaf0ff;
        }

        /* Main */

        .container {
            max-width: 1100px;

            margin: 40px auto;

            padding: 20px;
        }

        /* Heading */

        .heading {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;
        }

        .heading h2 {
            color: #315dcc;
        }

        /* Create Button */

        .create-btn {
            background: #4f7cff;
            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }

        .create-btn:hover {
            background: #315dcc;
        }

        /* Assignment List */

        .assignment-list {
            display: flex;

            flex-direction: column;

            gap: 18px;
        }

        /* Assignment Card */

        .assignment-card {
            background: white;

            padding: 22px;

            border-radius: 15px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;
        }

        .assignment-info h3 {
            color: #315dcc;

            margin-bottom: 8px;
        }

        .assignment-info p {
            color: #64748b;

            margin: 4px 0;

            font-size: 14px;
        }

        .assignment-actions {
            display: flex;

            gap: 10px;
        }

        .view-btn {
            background: #4f7cff;

            color: white;

            border: none;

            padding: 10px 16px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;
        }

        .view-btn:hover {
            background: #315dcc;
        }

        .delete-btn {
            background: #fee2e2;

            color: #dc2626;

            border: none;

            padding: 10px 16px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        .empty {
            background: white;

            padding: 40px;

            border-radius: 15px;

            text-align: center;

            color: #64748b;
        }

        /* Mobile */

        @media (max-width: 700px) {

            .heading {
                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }

            .assignment-card {
                flex-direction: column;

                align-items: flex-start;
            }

            .assignment-actions {
                width: 100%;
            }

            .assignment-actions button {
                flex: 1;
            }

        }
    </style>
</head>

<body>

    <!-- Header -->

    <header>

        <h1>CSE IntelliLearn</h1>

        <button
            class="back-btn"
            onclick="goBack()">

            ← Dashboard

        </button>

    </header>


    <!-- Main -->

    <div class="container">


        <!-- Heading -->

        <div class="heading">

            <h2>
                Teacher Assignments
            </h2>

            <button
                class="create-btn"
                onclick="createAssignment()">

                + Create Assignment

            </button>

        </div>


        <!-- Assignment List -->

        <div
            class="assignment-list"
            id="assignmentList">
        </div>

    </div>


    <script>

        /*
            Demo assignments

            Backend connect केल्यानंतर
            हे database मधून येतील.
        */

        let assignments = [

            {
                id: 1,

                title: "Data Structure Assignment",

                subject: "Data Structure Using C",

                semester: "3",

                unit: "Unit 1",

                topic: "Topic 1 - Data Structure Using C",

                dueDate: "05 October 2026"
            },


            {
                id: 2,

                title: "Computer Network Assignment",

                subject: "Computer Network",

                semester: "3",

                unit: "Unit 2",

                topic: "Topic 2 - Computer Network",

                dueDate: "08 October 2026"
            },


            {
                id: 3,

                title: "Operating System Assignment",

                subject: "Operating System",

                semester: "4",

                unit: "Unit 1",

                topic: "Topic 1 - Operating System",

                dueDate: "10 October 2026"
            }

        ];


        /* Display assignments */

        function displayAssignments() {

            const list =
                document.getElementById(
                    "assignmentList"
                );


            list.innerHTML = "";


            if (assignments.length === 0) {

                list.innerHTML = `

                    <div class="empty">

                        <h3>
                            No Assignments
                        </h3>

                        <p>
                            Create a new assignment to get started.
                        </p>

                    </div>

                `;

                return;

            }


            assignments.forEach(
                function(assignment) {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "assignment-card";


                    card.innerHTML = `

                        <div class="assignment-info">

                            <h3>
                                ${assignment.title}
                            </h3>

                            <p>
                                <strong>Subject:</strong>
                                ${assignment.subject}
                            </p>

                            <p>
                                <strong>Semester:</strong>
                                ${assignment.semester}
                            </p>

                            <p>
                                <strong>Unit:</strong>
                                ${assignment.unit}
                            </p>

                            <p>
                                <strong>Topic:</strong>
                                ${assignment.topic}
                            </p>

                            <p>
                                <strong>Due Date:</strong>
                                ${assignment.dueDate}
                            </p>

                        </div>


                        <div class="assignment-actions">

                            <button
                                class="view-btn"
                                onclick="viewAssignment(${assignment.id})">

                                View

                            </button>


                            <button
                                class="delete-btn"
                                onclick="deleteAssignment(${assignment.id})">

                                Delete

                            </button>

                        </div>

                    `;


                    list.appendChild(card);

                }
            );

        }


        /* Create assignment */

        function createAssignment() {

            window.location.href =
                "create-assignment.html";

        }


        /* View */

        function viewAssignment(id) {

            const assignment =
                assignments.find(
                    function(item) {
                        return item.id === id;
                    }
                );


            if (!assignment) {
                return;
            }


            window.location.href =
                "create-assignment.html" +

                "?title=" +
                encodeURIComponent(
                    assignment.title
                ) +

                "&subject=" +
                encodeURIComponent(
                    assignment.subject
                ) +

                "&semester=" +
                encodeURIComponent(
                    assignment.semester
                ) +

                "&unit=" +
                encodeURIComponent(
                    assignment.unit
                ) +

                "&topic=" +
                encodeURIComponent(
                    assignment.topic
                ) +

                "&dueDate=" +
                encodeURIComponent(
                    assignment.dueDate
                );

        }


        /* Delete */

        function deleteAssignment(id) {

            const confirmDelete =
                confirm(
                    "Delete this assignment?"
                );


            if (!confirmDelete) {
                return;
            }


            assignments =
                assignments.filter(
                    function(item) {
                        return item.id !== id;
                    }
                );


            displayAssignments();

        }


        /* Back */

        function goBack() {

            window.location.href =
                "teacher-dashboard.html";

        }


        /* Initial display */

        displayAssignments();

    </script>

</body>
</html>
