<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Submissions - CSE IntelliLearn</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8ff;
            color: #1e293b;
        }

        header {
            background: #4f7cff;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        .back-btn {
            background: white;
            color: #4f7cff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-title h2 {
            color: #2563eb;
            margin-bottom: 8px;
        }

        .submission-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;

            box-shadow: 0 5px 18px rgba(0,0,0,0.08);

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;
        }

        .submission-info h3 {
            color: #2563eb;
            margin-bottom: 10px;
        }

        .submission-info p {
            margin: 6px 0;
            color: #475569;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
        }

        .checked {
            background: #dcfce7;
            color: #166534;
        }

        .review-btn {
            background: #4f7cff;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }

        .review-btn:hover {
            background: #365fd9;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 15px;
            color: #64748b;
            display: none;
        }

        @media (max-width: 700px) {

            header {
                padding: 15px 20px;
            }

            header h1 {
                font-size: 20px;
            }

            .submission-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .review-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>CSE IntelliLearn</h1>

    <button class="back-btn" onclick="goBack()">
        ← Dashboard
    </button>

</header>


<div class="container">

    <div class="page-title">

        <h2>Student Submissions</h2>

        <p>
            View and check assignments submitted by students
        </p>

    </div>


    <div id="submissionList"></div>


    <div class="empty" id="emptyMessage">

        <h3>No submissions found</h3>

        <p>
            Student assignment submissions will appear here.
        </p>

    </div>

</div>


<script>

    /*
        Frontend demo submissions
    */

    const submissions = [

        {
            id: 1,

            studentName: "Vaishnavi Desai",

            rollNo: "13",

            assignment:
                "Data Structure Assignment",

            subject:
                "Data Structure Using C",

            unit:
                "Unit 1",

            topic:
                "Topic 1 - Data Structure Using C",

            submittedOn:
                "03 October 2026",

            status:
                "Pending"
        },


        {
            id: 2,

            studentName: "Student 2",

            rollNo: "21",

            assignment:
                "Computer Network Assignment",

            subject:
                "Computer Network",

            unit:
                "Unit 2",

            topic:
                "Topic 2 - Computer Network",

            submittedOn:
                "03 October 2026",

            status:
                "Checked"
        },


        {
            id: 3,

            studentName: "Student 3",

            rollNo: "25",

            assignment:
                "Operating System Assignment",

            subject:
                "Operating System",

            unit:
                "Unit 1",

            topic:
                "Topic 1 - Operating System",

            submittedOn:
                "04 October 2026",

            status:
                "Pending"
        }

    ];


    function displaySubmissions() {

        const list =
            document.getElementById("submissionList");

        list.innerHTML = "";


        if (submissions.length === 0) {

            document.getElementById("emptyMessage")
                .style.display = "block";

            return;
        }


        submissions.forEach(function(submission) {

            const card =
                document.createElement("div");

            card.className =
                "submission-card";


            const statusClass =
                submission.status === "Checked"
                ? "checked"
                : "pending";


            card.innerHTML = `

                <div class="submission-info">

                    <h3>
                        ${submission.assignment}
                    </h3>

                    <p>
                        <strong>Student:</strong>
                        ${submission.studentName}
                    </p>

                    <p>
                        <strong>Roll No:</strong>
                        ${submission.rollNo}
                    </p>

                    <p>
                        <strong>Subject:</strong>
                        ${submission.subject}
                    </p>

                    <p>
                        <strong>Unit:</strong>
                        ${submission.unit}
                    </p>

                    <p>
                        <strong>Topic:</strong>
                        ${submission.topic}
                    </p>

                    <p>
                        <strong>Submitted On:</strong>
                        ${submission.submittedOn}
                    </p>

                    <span class="status ${statusClass}">
                        ${submission.status}
                    </span>

                </div>


                <button
                    class="review-btn"
                    onclick="reviewSubmission(${submission.id})">

                    ${submission.status === "Checked"
                        ? "View Feedback"
                        : "Check Assignment"}

                </button>

            `;


            list.appendChild(card);

        });

    }


    function reviewSubmission(id) {

        const submission =
            submissions.find(function(item) {

                return item.id === id;

            });


        if (!submission) {
            return;
        }


        window.location.href =
            "give-feedback.html" +

            "?assignment=" +
            encodeURIComponent(
                submission.assignment
            ) +

            "&student=" +
            encodeURIComponent(
                submission.studentName
            ) +

            "&rollNo=" +
            encodeURIComponent(
                submission.rollNo
            ) +

            "&subject=" +
            encodeURIComponent(
                submission.subject
            ) +

            "&unit=" +
            encodeURIComponent(
                submission.unit
            ) +

            "&topic=" +
            encodeURIComponent(
                submission.topic
            );
    }


    function goBack() {

        window.location.href =
            "teacher-dashboard.html";

    }


    displaySubmissions();

</script>

</body>
</html>
