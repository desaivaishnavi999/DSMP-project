<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select Semester - Teacher | CSE IntelliLearn</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8ff;
            color: #1e293b;
        }

        header {
            background: #4f7cff;
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        .back-btn {
            background: white;
            color: #4f7cff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .heading h2 {
            color: #315dcc;
            margin-bottom: 8px;
        }

        .heading p {
            color: #64748b;
        }

        .semester-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .semester-card {
            background: white;
            padding: 35px 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .semester-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .semester-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .semester-card h3 {
            color: #315dcc;
            margin-bottom: 10px;
        }

        .semester-card p {
            color: #64748b;
            margin-bottom: 20px;
        }

        .semester-card button {
            background: #4f7cff;
            color: white;
            border: none;
            padding: 11px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .semester-card button:hover {
            background: #315dcc;
        }
    </style>
</head>

<body>

    <header>

        <h1>CSE IntelliLearn</h1>

        <button class="back-btn" onclick="goBack()">
            ← Select Year
        </button>

    </header>


    <div class="container">

        <div class="heading">
            <h2 id="pageTitle">Select Semester</h2>

            <p>
                Select a semester to manage its subjects and academic content.
            </p>
        </div>


        <div class="semester-container" id="semesterContainer">
        </div>

    </div>


    <script>

        // Get selected year from URL
        const urlParams = new URLSearchParams(window.location.search);

        const year = urlParams.get("year");


        // Semester data
        const yearData = {

            1: {
                name: "First Year",
                semesters: [1, 2]
            },

            2: {
                name: "Second Year",
                semesters: [3, 4]
            },

            3: {
                name: "Third Year",
                semesters: [5, 6]
            },

            4: {
                name: "Final Year",
                semesters: [7, 8]
            }

        };


        const selectedYear = yearData[year];


        // Page title
        if (selectedYear) {

            document.getElementById("pageTitle").innerText =
                selectedYear.name + " - Select Semester";

        }


        // Display semesters
        const semesterContainer =
            document.getElementById("semesterContainer");


        if (selectedYear) {

            selectedYear.semesters.forEach(function(semester) {

                const card = document.createElement("div");

                card.className = "semester-card";

                card.innerHTML = `

                    <div class="semester-icon">📘</div>

                    <h3>Semester ${semester}</h3>

                    <p>
                        Manage subjects, units, topics and study material.
                    </p>

                    <button onclick="openSubjects(${semester})">
                        Select
                    </button>

                `;

                semesterContainer.appendChild(card);

            });

        } else {

            semesterContainer.innerHTML = `

                <div class="semester-card">

                    <h3>Invalid Year</h3>

                    <p>Please select a valid academic year.</p>

                    <button onclick="goBack()">
                        Go Back
                    </button>

                </div>

            `;

        }


        // Open subjects page
        function openSubjects(semester) {

            window.location.href =
                "teacher-subjects.html?semester=" + semester;

        }


        // Back button
        function goBack() {

            window.location.href =
                "teacher-year.html";

        }

    </script>

</body>
</html>
