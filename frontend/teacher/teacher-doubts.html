<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Doubts - CSE IntelliLearn</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8ff;
            color: #1e293b;
        }

        header {
            background: #4f7cff;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        .back-btn {
            background: white;
            color: #4f7cff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-title h2 {
            color: #2563eb;
            margin-bottom: 8px;
        }

        .doubt-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;

            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
        }

        .doubt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .doubt-header h3 {
            color: #2563eb;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }

        .waiting {
            background: #fef3c7;
            color: #92400e;
        }

        .answered {
            background: #dcfce7;
            color: #166534;
        }

        .info {
            color: #475569;
            margin-bottom: 8px;
        }

        .question {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            line-height: 1.6;
        }

        .answer-box {
            display: none;
            margin-top: 15px;
        }

        .answer-box textarea {
            width: 100%;
            min-height: 110px;
            padding: 12px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            resize: vertical;
            font-size: 15px;
            outline: none;
        }

        .answer-box textarea:focus {
            border-color: #4f7cff;
        }

        .answer-btn {
            margin-top: 10px;
            background: #4f7cff;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .answer-btn:hover {
            background: #365fd9;
        }

        .show-answer {
            background: #eef4ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .show-answer strong {
            color: #2563eb;
        }

        @media (max-width: 650px) {

            header {
                padding: 15px 20px;
            }

            header h1 {
                font-size: 20px;
            }

            .doubt-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>CSE IntelliLearn</h1>

    <button class="back-btn" onclick="goBack()">
        ← Dashboard
    </button>

</header>


<div class="container">

    <div class="page-title">

        <h2>Student Doubts</h2>

        <p>
            View student doubts and provide answers
        </p>

    </div>


    <div id="doubtList"></div>

</div>


<script>

    /*
        Frontend demo doubts
    */

    const doubts = [

        {
            id: 1,

            student:
                "Vaishnavi Desai",

            rollNo:
                "13",

            subject:
                "Data Structure Using C",

            topic:
                "Linked List",

            question:
                "Can you explain the difference between singly and doubly linked list?",

            status:
                "Waiting for Answer",

            answer:
                ""
        },


        {
            id: 2,

            student:
                "Student 2",

            rollNo:
                "21",

            subject:
                "Computer Network",

            topic:
                "OSI Model",

            question:
                "What is the main function of the transport layer?",

            status:
                "Answered",

            answer:
                "The transport layer provides end-to-end communication, reliability and flow control."
        },


        {
            id: 3,

            student:
                "Student 3",

            rollNo:
                "25",

            subject:
                "Operating System",

            topic:
                "Process Management",

            question:
                "What is the difference between a process and a thread?",

            status:
                "Waiting for Answer",

            answer:
                ""
        }

    ];


    function displayDoubts() {

        const list =
            document.getElementById("doubtList");

        list.innerHTML = "";


        doubts.forEach(function(doubt) {

            const card =
                document.createElement("div");

            card.className =
                "doubt-card";


            const statusClass =
                doubt.status === "Answered"
                ? "answered"
                : "waiting";


            card.innerHTML = `

                <div class="doubt-header">

                    <h3>
                        ${doubt.topic}
                    </h3>

                    <span class="status ${statusClass}">
                        ${doubt.status}
                    </span>

                </div>


                <p class="info">
                    <strong>Student:</strong>
                    ${doubt.student}
                </p>

                <p class="info">
                    <strong>Roll No:</strong>
                    ${doubt.rollNo}
                </p>

                <p class="info">
                    <strong>Subject:</strong>
                    ${doubt.subject}
                </p>


                <div class="question">

                    <strong>Question:</strong>

                    <br><br>

                    ${doubt.question}

                </div>


                ${
                    doubt.status === "Waiting for Answer"

                    ?

                    `
                    <button
                        class="answer-btn"
                        onclick="showAnswerBox(${doubt.id})">

                        Answer Doubt

                    </button>


                    <div
                        class="answer-box"
                        id="answerBox${doubt.id}">

                        <textarea
                            id="answer${doubt.id}"
                            placeholder="Write your answer...">
                        </textarea>

                        <button
                            class="answer-btn"
                            onclick="submitAnswer(${doubt.id})">

                            Submit Answer

                        </button>

                    </div>
                    `

                    :

                    `
                    <div class="show-answer"
                         style="display:block;">

                        <strong>
                            Teacher Answer:
                        </strong>

                        <br><br>

                        ${doubt.answer}

                    </div>
                    `
                }

            `;


            list.appendChild(card);

        });

    }


    function showAnswerBox(id) {

        const box =
            document.getElementById(
                "answerBox" + id
            );

        box.style.display = "block";

    }


    function submitAnswer(id) {

        const doubt =
            doubts.find(function(item) {

                return item.id === id;

            });


        if (!doubt) {
            return;
        }


        const answer =
            document.getElementById(
                "answer" + id
            ).value.trim();


        if (answer === "") {

            alert("Please write an answer.");

            return;
        }


        doubt.answer =
            answer;

        doubt.status =
            "Answered";


        /*
            Save latest answered doubt
            for frontend demo
        */

        localStorage.setItem(
            "teacherDoubtAnswer",
            JSON.stringify(doubt)
        );


        displayDoubts();

    }


    function goBack() {

        window.location.href =
            "teacher-dashboard.html";

    }


    displayDoubts();

</script>

</body>
</html>
