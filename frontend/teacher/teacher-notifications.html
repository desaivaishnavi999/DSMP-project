<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Notifications - CSE IntelliLearn</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8ff;
            color: #1e293b;
        }

        header {
            background: #4f7cff;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        .back-btn {
            background: white;
            color: #4f7cff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-title h2 {
            color: #2563eb;
            margin-bottom: 8px;
        }

        .notification-card {
            background: white;
            padding: 22px;
            margin-bottom: 16px;
            border-radius: 14px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.07);

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;

            border-left: 5px solid #4f7cff;
        }

        .notification-card.read {
            opacity: 0.65;
            border-left-color: #94a3b8;
        }

        .notification-content h3 {
            color: #2563eb;
            margin-bottom: 8px;
        }

        .notification-content p {
            color: #64748b;
            line-height: 1.5;
        }

        .notification-time {
            margin-top: 8px;
            font-size: 13px;
            color: #94a3b8;
        }

        .read-btn {
            background: #eef4ff;
            color: #2563eb;
            border: none;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }

        .read-btn:hover {
            background: #dbeafe;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 14px;
            color: #64748b;
            display: none;
        }

        @media (max-width: 650px) {

            header {
                padding: 15px 20px;
            }

            header h1 {
                font-size: 20px;
            }

            .notification-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .read-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>CSE IntelliLearn</h1>

    <button class="back-btn" onclick="goBack()">
        ← Dashboard
    </button>

</header>


<div class="container">

    <div class="page-title">

        <h2>Notifications</h2>

        <p>
            Stay updated with student activities
        </p>

    </div>


    <div id="notificationList"></div>


    <div class="empty" id="emptyMessage">

        <h3>No Notifications</h3>

        <p>
            You don't have any notifications right now.
        </p>

    </div>

</div>


<script>

    const notifications = [

        {
            id: 1,

            title:
                "New Assignment Submission",

            message:
                "Vaishnavi Desai submitted Data Structure Assignment.",

            time:
                "Today, 10:30 AM"
        },


        {
            id: 2,

            title:
                "New Student Doubt",

            message:
                "A student has posted a new doubt in Computer Network.",

            time:
                "Today, 09:45 AM"
        },


        {
            id: 3,

            title:
                "Assignment Deadline Reminder",

            message:
                "Computer Network Assignment deadline is approaching.",

            time:
                "Yesterday, 06:00 PM"
        },


        {
            id: 4,

            title:
                "New Assignment Created",

            message:
                "Your Operating System assignment has been created successfully.",

            time:
                "Yesterday, 04:20 PM"
        },


        {
            id: 5,

            title:
                "Student Submission Checked",

            message:
                "Feedback has been saved for a student assignment.",

            time:
                "28 September 2026"
        }

    ];


    function getReadStatus() {

        return JSON.parse(
            localStorage.getItem(
                "teacherNotificationRead"
            ) || "{}"
        );

    }


    function displayNotifications() {

        const list =
            document.getElementById(
                "notificationList"
            );

        list.innerHTML = "";


        const readStatus =
            getReadStatus();


        if (notifications.length === 0) {

            document.getElementById(
                "emptyMessage"
            ).style.display = "block";

            return;
        }


        notifications.forEach(function(notification) {

            const card =
                document.createElement("div");


            const isRead =
                readStatus[notification.id] === true;


            card.className =
                "notification-card" +
                (isRead ? " read" : "");


            card.innerHTML = `

                <div class="notification-content">

                    <h3>
                        ${notification.title}
                    </h3>

                    <p>
                        ${notification.message}
                    </p>

                    <div class="notification-time">
                        ${notification.time}
                    </div>

                </div>


                <button
                    class="read-btn"
                    onclick="markAsRead(${notification.id})">

                    ${isRead ? "Read" : "Mark as Read"}

                </button>

            `;


            list.appendChild(card);

        });

    }


    function markAsRead(id) {

        const readStatus =
            getReadStatus();


        readStatus[id] = true;


        localStorage.setItem(
            "teacherNotificationRead",
            JSON.stringify(readStatus)
        );


        displayNotifications();

    }


    function goBack() {

        window.location.href =
            "teacher-dashboard.html";

    }


    displayNotifications();

</script>

</body>
</html>
