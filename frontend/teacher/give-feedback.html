<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Give Feedback - CSE IntelliLearn</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8ff;
            color: #1e293b;
        }

        header {
            background: #4f7cff;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        .back-btn {
            background: white;
            color: #4f7cff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-title h2 {
            color: #2563eb;
            margin-bottom: 8px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .info-row {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 15px;

            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: bold;
            color: #475569;
        }

        .value {
            color: #1e293b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #334155;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #4f7cff;
        }

        input {
            max-width: 200px;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;

            background: #4f7cff;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .submit-btn:hover {
            background: #365fd9;
        }

        .success {
            display: none;

            margin-top: 20px;
            padding: 14px;

            background: #dcfce7;
            color: #166534;

            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            header {
                padding: 15px 20px;
            }

            header h1 {
                font-size: 20px;
            }

            .info-row {
                grid-template-columns: 1fr;
                gap: 5px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>CSE IntelliLearn</h1>

    <button class="back-btn" onclick="goBack()">
        ← Back
    </button>

</header>


<div class="container">

    <div class="page-title">

        <h2>Check Assignment</h2>

        <p>
            Review student submission and provide feedback
        </p>

    </div>


    <!-- Student Submission Information -->

    <div class="card">

        <div class="info-row">

            <div class="label">
                Student
            </div>

            <div class="value" id="student">
                -
            </div>

        </div>


        <div class="info-row">

            <div class="label">
                Roll No
            </div>

            <div class="value" id="rollNo">
                -
            </div>

        </div>


        <div class="info-row">

            <div class="label">
                Assignment
            </div>

            <div class="value" id="assignment">
                -
            </div>

        </div>


        <div class="info-row">

            <div class="label">
                Subject
            </div>

            <div class="value" id="subject">
                -
            </div>

        </div>


        <div class="info-row">

            <div class="label">
                Unit
            </div>

            <div class="value" id="unit">
                -
            </div>

        </div>


        <div class="info-row">

            <div class="label">
                Topic
            </div>

            <div class="value" id="topic">
                -
            </div>

        </div>

    </div>


    <!-- Feedback Form -->

    <div class="card">

        <form id="feedbackForm">

            <div class="form-group">

                <label>
                    Marks
                </label>

                <input
                    type="number"
                    id="marks"
                    min="0"
                    max="10"
                    placeholder="Enter marks out of 10"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Teacher Feedback
                </label>

                <textarea
                    id="feedback"
                    placeholder="Write feedback for the student..."
                    required
                ></textarea>

            </div>


            <button
                type="submit"
                class="submit-btn">

                Submit Feedback

            </button>


            <div
                class="success"
                id="successMessage">

                ✓ Feedback submitted successfully!
                Assignment status changed to Checked.

            </div>

        </form>

    </div>

</div>


<script>

    // Read submission information from URL

    const params =
        new URLSearchParams(window.location.search);


    const student =
        params.get("student") || "Student";


    const rollNo =
        params.get("rollNo") || "-";


    const assignment =
        params.get("assignment") || "-";


    const subject =
        params.get("subject") || "-";


    const unit =
        params.get("unit") || "-";


    const topic =
        params.get("topic") || "-";


    // Display information

    document.getElementById("student").textContent =
        student;

    document.getElementById("rollNo").textContent =
        rollNo;

    document.getElementById("assignment").textContent =
        assignment;

    document.getElementById("subject").textContent =
        subject;

    document.getElementById("unit").textContent =
        unit;

    document.getElementById("topic").textContent =
        topic;


    // Submit feedback

    document.getElementById("feedbackForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const marks =
                document.getElementById("marks").value;


            const feedback =
                document.getElementById("feedback").value;


            const feedbackData = {

                student: student,

                rollNo: rollNo,

                assignment: assignment,

                subject: subject,

                unit: unit,

                topic: topic,

                marks: marks,

                feedback: feedback,

                status: "Checked",

                reviewedBy: "CSE Faculty",

                reviewedOn:
                    new Date().toLocaleDateString()

            };


            // Save feedback in localStorage

            localStorage.setItem(
                "teacherFeedback",
                JSON.stringify(feedbackData)
            );


            // Show success message

            document.getElementById(
                "successMessage"
            ).style.display = "block";


            // Disable button after submission

            document.querySelector(
                ".submit-btn"
            ).disabled = true;


            document.querySelector(
                ".submit-btn"
            ).style.opacity = "0.6";

        });


    // Back to submissions

    function goBack() {

        window.location.href =
            "teacher-submissions.html";

    }

</script>

</body>
</html>
