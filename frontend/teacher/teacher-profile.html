<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Profile - CSE IntelliLearn</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8ff;
            color: #1e293b;
        }

        header {
            background: #4f7cff;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        .back-btn {
            background: white;
            color: #4f7cff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-title h2 {
            color: #2563eb;
            margin-bottom: 8px;
        }

        .profile-card {
            background: white;
            padding: 35px;
            border-radius: 18px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .profile-top {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-icon {
            width: 90px;
            height: 90px;

            margin: auto;
            margin-bottom: 15px;

            border-radius: 50%;

            background: #dbeafe;
            color: #2563eb;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 38px;
            font-weight: bold;
        }

        .profile-top h3 {
            color: #2563eb;
            margin-bottom: 5px;
        }

        .profile-top p {
            color: #64748b;
        }

        .info-row {
            display: grid;
            grid-template-columns: 180px 1fr;

            padding: 14px 0;

            border-bottom: 1px solid #e2e8f0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: bold;
            color: #475569;
        }

        .value {
            color: #1e293b;
        }

        .logout-btn {
            width: 100%;

            margin-top: 30px;
            padding: 13px;

            background: #ef4444;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        @media (max-width: 600px) {

            header {
                padding: 15px 20px;
            }

            header h1 {
                font-size: 20px;
            }

            .profile-card {
                padding: 25px 20px;
            }

            .info-row {
                grid-template-columns: 1fr;
                gap: 5px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>CSE IntelliLearn</h1>

    <button
        class="back-btn"
        onclick="goBack()">

        ← Dashboard

    </button>

</header>


<div class="container">

    <div class="page-title">

        <h2>Teacher Profile</h2>

        <p>
            View your profile information
        </p>

    </div>


    <div class="profile-card">

        <div class="profile-top">

            <div class="profile-icon">
                T
            </div>

            <h3>
                CSE Faculty
            </h3>

            <p>
                Teacher
            </p>

        </div>


        <div class="info-row">

            <div class="label">
                Name
            </div>

            <div class="value">
                CSE Faculty
            </div>

        </div>


        <div class="info-row">

            <div class="label">
                Email
            </div>

            <div class="value">
                teacher@intellilearn.com
            </div>

        </div>


        <div class="info-row">

            <div class="label">
                Role
            </div>

            <div class="value">
                Teacher
            </div>

        </div>


        <div class="info-row">

            <div class="label">
                Department
            </div>

            <div class="value">
                Computer Science & Engineering
            </div>

        </div>


        <div class="info-row">

            <div class="label">
                Course
            </div>

            <div class="value">
                B.Tech CSE
            </div>

        </div>


        <div class="info-row">

            <div class="label">
                University
            </div>

            <div class="value">
                Shivaji University
            </div>

        </div>


        <div class="info-row">

            <div class="label">
                College
            </div>

            <div class="value">
                SGMCOE
            </div>

        </div>


        <button
            class="logout-btn"
            onclick="logout()">

            Logout

        </button>

    </div>

</div>


<script>

    function goBack() {

        window.location.href =
            "teacher-dashboard.html";

    }


    function logout() {

        const confirmLogout =
            confirm("Are you sure you want to logout?");


        if (confirmLogout) {

            localStorage.clear();

            window.location.href =
                "../login.html";

        }

    }

</script>

</body>
</html>
