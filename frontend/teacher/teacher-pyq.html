<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PYQ - Teacher | CSE IntelliLearn</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8ff;
            color: #1e293b;
        }

        header {
            background: #4f7cff;
            color: white;
            padding: 18px 35px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        .back-btn {
            background: white;
            color: #4f7cff;
            border: none;

            padding: 10px 18px;
            border-radius: 8px;

            cursor: pointer;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #eaf0ff;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .topic-info {
            background: white;
            padding: 22px;

            border-radius: 15px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.08);

            margin-bottom: 25px;
        }

        .topic-info h2 {
            color: #315dcc;
            margin-bottom: 12px;
        }

        .topic-info p {
            color: #64748b;
            margin: 5px 0;
        }

        .pyq-box {
            background: white;
            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .pyq-box h2 {
            color: #315dcc;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            font-weight: bold;
            color: #334155;
        }

        select,
        input[type="file"] {
            width: 100%;

            padding: 12px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            background: white;
        }

        .file-box {
            background: #f4f8ff;

            border: 2px dashed #9bb5ff;

            padding: 25px;

            text-align: center;

            border-radius: 10px;
        }

        .upload-btn {
            width: 100%;

            background: #4f7cff;
            color: white;

            border: none;

            padding: 13px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
            font-size: 15px;
        }

        .upload-btn:hover {
            background: #315dcc;
        }

        .success {
            display: none;

            background: #e8f7ee;
            color: #15803d;

            padding: 15px;

            border-radius: 8px;

            margin-top: 20px;

            text-align: center;
        }
    </style>
</head>

<body>

    <header>

        <h1>CSE IntelliLearn</h1>

        <button
            class="back-btn"
            onclick="goBack()">

            ← Topic

        </button>

    </header>


    <div class="container">

        <!-- Topic Information -->

        <div class="topic-info">

            <h2 id="topicName">
                Previous Year Questions
            </h2>

            <p id="subjectName">
                Subject:
            </p>

            <p id="semesterName">
                Semester:
            </p>

            <p id="unitName">
                Unit:
            </p>

        </div>


        <!-- PYQ Form -->

        <div class="pyq-box">

            <h2>Upload Previous Year Question Paper</h2>

            <form id="pyqForm">

                <!-- Exam Year -->

                <div class="form-group">

                    <label for="examYear">
                        Exam Year
                    </label>

                    <select
                        id="examYear"
                        required>

                        <option value="">
                            Select Year
                        </option>

                        <option value="2026">
                            2026
                        </option>

                        <option value="2025">
                            2025
                        </option>

                        <option value="2024">
                            2024
                        </option>

                        <option value="2023">
                            2023
                        </option>

                        <option value="2022">
                            2022
                        </option>

                    </select>

                </div>


                <!-- PDF -->

                <div class="form-group">

                    <label>
                        Question Paper PDF
                    </label>

                    <div class="file-box">

                        <p>
                            📄 Select PYQ PDF
                        </p>

                        <br>

                        <input
                            type="file"
                            id="pyqFile"
                            accept=".pdf"
                            required>

                    </div>

                </div>


                <button
                    type="submit"
                    class="upload-btn">

                    Upload PYQ

                </button>

            </form>


            <div
                class="success"
                id="successMessage">

                ✅ Previous Year Question Paper uploaded successfully!

            </div>

        </div>

    </div>


    <script>

        /* URL Parameters */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const subject =
            urlParams.get("subject");

        const semester =
            urlParams.get("semester");

        const unit =
            urlParams.get("unit");

        const topic =
            urlParams.get("topic");


        /* Display data */

        document.getElementById(
            "topicName"
        ).innerText =
            topic || "Previous Year Questions";


        document.getElementById(
            "subjectName"
        ).innerText =
            "Subject: " +
            (subject || "");


        document.getElementById(
            "semesterName"
        ).innerText =
            "Semester: " +
            (semester || "");


        document.getElementById(
            "unitName"
        ).innerText =
            "Unit: " +
            (unit || "");


        /* Submit */

        document.getElementById(
            "pyqForm"
        ).addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                const examYear =
                    document.getElementById(
                        "examYear"
                    ).value;

                const file =
                    document.getElementById(
                        "pyqFile"
                    ).files[0];


                if (!file) {

                    alert(
                        "Please select a PDF file."
                    );

                    return;

                }


                const pyqData = {

                    examYear: examYear,

                    fileName: file.name,

                    subject: subject,

                    semester: semester,

                    unit: unit,

                    topic: topic

                };


                /* Frontend demo */

                localStorage.setItem(
                    "teacherPYQ",
                    JSON.stringify(pyqData)
                );


                document.getElementById(
                    "successMessage"
                ).style.display = "block";


                document.getElementById(
                    "pyqForm"
                ).reset();

            }
        );


        /* Back */

        function goBack() {

            window.location.href =
                "teacher-notes.html" +

                "?subject=" +
                encodeURIComponent(subject) +

                "&semester=" +
                encodeURIComponent(semester) +

                "&unit=" +
                encodeURIComponent(unit) +

                "&topic=" +
                encodeURIComponent(topic);

        }

    </script>

</body>
</html>
