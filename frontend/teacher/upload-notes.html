<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Notes - Teacher | CSE IntelliLearn</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8ff;
            color: #1e293b;
        }

        /* Header */

        header {
            background: #4f7cff;
            color: white;
            padding: 18px 35px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        .back-btn {
            background: white;
            color: #4f7cff;
            border: none;

            padding: 10px 18px;
            border-radius: 8px;

            cursor: pointer;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #eaf0ff;
        }

        /* Main */

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        /* Topic information */

        .topic-info {
            background: white;
            padding: 22px;

            border-radius: 15px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.08);

            margin-bottom: 25px;
        }

        .topic-info h2 {
            color: #315dcc;
            margin-bottom: 12px;
        }

        .topic-info p {
            color: #64748b;
            margin: 5px 0;
        }

        /* Upload box */

        .upload-box {
            background: white;
            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .upload-box h2 {
            color: #315dcc;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;

            font-weight: bold;
            color: #334155;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;

            padding: 12px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            outline: none;

            font-size: 14px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #4f7cff;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .file-box {
            background: #f4f8ff;

            border: 2px dashed #9bb5ff;

            padding: 25px;

            text-align: center;

            border-radius: 10px;
        }

        .file-box input {
            border: none;
            padding: 10px;
        }

        .upload-btn {
            width: 100%;

            background: #4f7cff;
            color: white;

            border: none;

            padding: 13px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
            font-size: 15px;
        }

        .upload-btn:hover {
            background: #315dcc;
        }

        .success {
            display: none;

            background: #e8f7ee;
            color: #15803d;

            padding: 15px;

            border-radius: 8px;

            margin-top: 20px;

            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Header -->

    <header>

        <h1>CSE IntelliLearn</h1>

        <button
            class="back-btn"
            onclick="goBack()">

            ← Topic

        </button>

    </header>


    <!-- Main -->

    <div class="container">


        <!-- Topic Information -->

        <div class="topic-info">

            <h2 id="topicName">
                Upload Notes
            </h2>

            <p id="subjectName">
                Subject:
            </p>

            <p id="semesterName">
                Semester:
            </p>

            <p id="unitName">
                Unit:
            </p>

        </div>


        <!-- Upload Form -->

        <div class="upload-box">

            <h2>Upload Study Material</h2>


            <form id="notesForm">


                <!-- Note Title -->

                <div class="form-group">

                    <label for="noteTitle">
                        Note Title
                    </label>

                    <input
                        type="text"
                        id="noteTitle"
                        placeholder="Enter note title"
                        required>

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Enter notes description"
                        required>
                    </textarea>

                </div>


                <!-- PDF -->

                <div class="form-group">

                    <label>
                        Select PDF
                    </label>

                    <div class="file-box">

                        <p>
                            📄 Select PDF file
                        </p>

                        <br>

                        <input
                            type="file"
                            id="pdfFile"
                            accept=".pdf"
                            required>

                    </div>

                </div>


                <!-- Upload -->

                <button
                    type="submit"
                    class="upload-btn">

                    Upload Notes

                </button>


            </form>


            <!-- Success -->

            <div
                class="success"
                id="successMessage">

                ✅ Notes uploaded successfully!

            </div>

        </div>

    </div>


    <script>

        /* Get URL parameters */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const subject =
            urlParams.get("subject");

        const semester =
            urlParams.get("semester");

        const unit =
            urlParams.get("unit");

        const topic =
            urlParams.get("topic");


        /* Display information */

        document.getElementById(
            "topicName"
        ).innerText =
            topic || "Upload Notes";


        document.getElementById(
            "subjectName"
        ).innerText =
            "Subject: " +
            (subject || "");


        document.getElementById(
            "semesterName"
        ).innerText =
            "Semester: " +
            (semester || "");


        document.getElementById(
            "unitName"
        ).innerText =
            "Unit: " +
            (unit || "");


        /* Form submit */

        document.getElementById(
            "notesForm"
        ).addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const title =
                    document.getElementById(
                        "noteTitle"
                    ).value;


                const description =
                    document.getElementById(
                        "description"
                    ).value;


                const file =
                    document.getElementById(
                        "pdfFile"
                    ).files[0];


                if (!file) {

                    alert(
                        "Please select a PDF file."
                    );

                    return;

                }


                /* Demo data */

                const noteData = {

                    title: title,

                    description: description,

                    fileName: file.name,

                    subject: subject,

                    semester: semester,

                    unit: unit,

                    topic: topic

                };


                /*
                    Frontend demo storage
                    Backend नंतर connect करू.
                */

                localStorage.setItem(
                    "teacherNote",
                    JSON.stringify(noteData)
                );


                /* Show success */

                document.getElementById(
                    "successMessage"
                ).style.display = "block";


                /* Reset form */

                document.getElementById(
                    "notesForm"
                ).reset();

            }
        );


        /* Back */

        function goBack() {

            window.location.href =
                "teacher-notes.html" +

                "?subject=" +
                encodeURIComponent(subject) +

                "&semester=" +
                encodeURIComponent(semester) +

                "&unit=" +
                encodeURIComponent(unit) +

                "&topic=" +
                encodeURIComponent(topic);

        }

    </script>

</body>
</html>
