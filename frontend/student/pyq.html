<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSE IntelliLearn - PYQ</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f9ff;
            color: #1e293b;
        }

        header {
            background: linear-gradient(135deg, #2563eb, #0d9488);
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .page-title {
            color: #1d4ed8;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        /* SELECT BOX */

        .selection-box {
            background: white;
            padding: 22px;

            border-radius: 12px;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);

            margin-bottom: 30px;
        }

        .selection-box h3 {
            color: #1d4ed8;
            margin-bottom: 15px;
        }

        .select-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        select {
            padding: 12px 15px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;

            min-width: 220px;

            outline: none;
        }

        select:focus {
            border-color: #2563eb;
        }

        /* SUBJECT GRID */

        .subject-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));

            gap: 20px;
        }

        .subject-card {
            background: white;

            padding: 25px;

            border-radius: 14px;

            border: 1px solid #e2e8f0;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .subject-card h3 {
            color: #1d4ed8;

            margin-bottom: 10px;
        }

        .subject-card p {
            color: #64748b;

            line-height: 1.5;

            margin-bottom: 18px;
        }

        .paper-list {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .paper-btn {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 10px 14px;

            background: #eff6ff;

            color: #1d4ed8;

            border-radius: 8px;

            text-decoration: none;

            font-weight: bold;
        }

        .paper-btn:hover {
            background: #dbeafe;
        }

        /* EMPTY */

        .empty {
            background: white;

            text-align: center;

            padding: 45px;

            border-radius: 12px;

            color: #64748b;
        }

        @media(max-width: 700px) {

            header {
                padding: 15px 20px;
            }

            header h1 {
                font-size: 20px;
            }

            .select-group {
                flex-direction: column;
            }

            select {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <h1>CSE IntelliLearn</h1>

        <a href="student-dashboard.html"
           class="back-btn">

            ← Dashboard

        </a>

    </header>



    <!-- MAIN -->

    <div class="container">


        <h2 class="page-title">
            Previous Year Questions
        </h2>


        <p class="subtitle">
            Select your year and semester to view previous year papers.
        </p>



        <!-- SELECTION -->

        <div class="selection-box">

            <h3>
                Select Academic Details
            </h3>


            <div class="select-group">


                <select id="yearSelect">

                    <option value="">
                        Select Year
                    </option>

                    <option value="First Year">
                        First Year
                    </option>

                    <option value="Second Year">
                        Second Year
                    </option>

                    <option value="Third Year">
                        Third Year
                    </option>

                    <option value="Final Year">
                        Final Year
                    </option>

                </select>



                <select id="semesterSelect">

                    <option value="">
                        Select Semester
                    </option>

                </select>


            </div>

        </div>



        <!-- SUBJECTS -->

        <div id="subjectContainer"
             class="subject-grid">


            <div class="empty">

                <h3>
                    Select Year and Semester
                </h3>

                <p>
                    Subjects and previous year papers
                    will appear here.
                </p>

            </div>


        </div>


    </div>



    <script>


        const yearSelect =
            document.getElementById("yearSelect");


        const semesterSelect =
            document.getElementById("semesterSelect");


        const subjectContainer =
            document.getElementById(
                "subjectContainer"
            );



        /* SEMESTER DATA */

        const semesterData = {

            "First Year": [
                "Semester 1",
                "Semester 2"
            ],

            "Second Year": [
                "Semester 3",
                "Semester 4"
            ],

            "Third Year": [
                "Semester 5",
                "Semester 6"
            ],

            "Final Year": [
                "Semester 7",
                "Semester 8"
            ]

        };



        /* SUBJECT DATA */

        const subjectData = {

            "Semester 1": [
                "Physics",
                "Graphics",
                "Engineering Mathematics-I",
                "Basic Civil Engineering",
                "Basic Electrical Engineering"
            ],

            "Semester 2": [
                "Engineering Chemistry",
                "Basic Mechanical Engineering",
                "Engineering Mechanics",
                "Basic Electrical Engineering",
                "Engineering Mathematics-II"
            ],

            "Semester 3": [
                "Data Structure Using C",
                "Computer Network",
                "MDM",
                "Discrete Mathematical Structure",
                "OE"
            ],

            "Semester 4": [
                "Automata Theory",
                "Operating System",
                "CPP-OOP",
                "Soft Skill",
                "MDM"
            ],

            "Semester 5": [
                "Subject 1",
                "Subject 2",
                "Subject 3",
                "Subject 4",
                "Subject 5"
            ],

            "Semester 6": [
                "Subject 1",
                "Subject 2",
                "Subject 3",
                "Subject 4",
                "Subject 5"
            ],

            "Semester 7": [
                "Subject 1",
                "Subject 2",
                "Subject 3",
                "Subject 4",
                "Subject 5"
            ],

            "Semester 8": [
                "Subject 1",
                "Subject 2",
                "Subject 3",
                "Subject 4",
                "Subject 5"
            ]

        };



        /* YEAR CHANGE */

        yearSelect.addEventListener(
            "change",
            function () {

                const selectedYear =
                    this.value;


                semesterSelect.innerHTML =
                    '<option value="">Select Semester</option>';


                subjectContainer.innerHTML = `
                    <div class="empty">
                        <h3>Select Semester</h3>
                        <p>
                            Select a semester to view subjects.
                        </p>
                    </div>
                `;


                if (!selectedYear) {
                    return;
                }


                semesterData[selectedYear]
                    .forEach(function (semester) {

                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value = semester;

                        option.textContent = semester;

                        semesterSelect.appendChild(
                            option
                        );

                    });

            }
        );



        /* SEMESTER CHANGE */

        semesterSelect.addEventListener(
            "change",
            function () {

                const semester =
                    this.value;


                if (!semester) {

                    subjectContainer.innerHTML = `
                        <div class="empty">
                            <h3>Select Semester</h3>
                            <p>
                                Select a semester to view subjects.
                            </p>
                        </div>
                    `;

                    return;
                }


                showSubjects(semester);

            }
        );



        /* SHOW SUBJECTS */

        function showSubjects(semester) {


            const subjects =
                subjectData[semester];


            subjectContainer.innerHTML = "";



            subjects.forEach(
                function (subject) {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "subject-card";


                    card.innerHTML = `

                        <h3>
                            ${subject}
                        </h3>

                        <p>
                            Previous year question papers
                            for ${subject}.
                        </p>

                        <div class="paper-list">

                            <a href="#"
                               class="paper-btn">

                                <span>2025 Paper</span>

                                <span>View →</span>

                            </a>

                            <a href="#"
                               class="paper-btn">

                                <span>2024 Paper</span>

                                <span>View →</span>

                            </a>

                            <a href="#"
                               class="paper-btn">

                                <span>2023 Paper</span>

                                <span>View →</span>

                            </a>

                        </div>

                    `;


                    subjectContainer.appendChild(
                        card
                    );

                }
            );

        }


    </script>


</body>

</html>
