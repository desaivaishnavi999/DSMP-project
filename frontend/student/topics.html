<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSE IntelliLearn - Units</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f9ff;
            font-family: Arial, sans-serif;
            color: #12305b;
        }

        /* HEADER */

        .page-header {
            background: linear-gradient(
                135deg,
                #0f3d91,
                #2563eb
            );

            color: white;
            padding: 30px 20px;
            text-align: center;

            box-shadow:
                0 4px 15px
                rgba(37, 99, 235, 0.20);
        }

        .page-header h1 {
            margin: 0;
            font-size: 32px;
        }

        .page-header p {
            margin: 10px 0 0;
            color: #eaf2ff;
        }


        /* CONTAINER */

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px 40px;
        }


        /* BACK */

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;

            color: #2563eb;
            text-decoration: none;

            font-size: 17px;
            font-weight: bold;
        }

        .back-btn:hover {
            color: #0f3d91;
        }


        /* HEADING */

        .heading-card {
            text-align: center;

            background: white;

            padding: 30px 20px;

            border-radius: 18px;

            margin-bottom: 25px;

            border-left: 5px solid #2563eb;

            box-shadow:
                0 5px 20px
                rgba(30, 64, 175, 0.08);
        }

        .heading-card h2 {
            margin: 0;

            font-size: 30px;

            color: #12305b;
        }

        .heading-card p {
            margin: 10px 0 0;

            color: #64748b;

            font-size: 16px;
        }


        /* UNIT CARDS */

        .unit-card {
            display: flex;

            align-items: center;

            background: white;

            min-height: 115px;

            margin-bottom: 20px;

            padding: 20px 28px;

            border-radius: 16px;

            border: 1px solid #e1eaf8;

            box-shadow:
                0 5px 18px
                rgba(30, 64, 175, 0.08);

            cursor: pointer;

            transition: 0.2s;
        }

        .unit-card:hover {
            transform: translateY(-3px);

            border-color: #93c5fd;

            box-shadow:
                0 9px 25px
                rgba(30, 64, 175, 0.13);
        }


        /* ICON */

        .unit-icon {
            width: 75px;
            height: 75px;

            border-radius: 18px;

            display: flex;

            justify-content: center;
            align-items: center;

            background: #eaf2ff;

            font-size: 34px;

            flex-shrink: 0;
        }

        .unit-card:hover .unit-icon {
            background: #dbeafe;
        }


        /* UNIT NUMBER */

        .unit-number {
            margin-left: 30px;

            font-size: 22px;

            font-weight: bold;

            color: #2563eb;
        }


        /* UNIT NAME */

        .unit-name {
            margin-left: 22px;

            font-size: 21px;

            font-weight: bold;

            color: #12305b;

            flex: 1;
        }

        .unit-card:hover .unit-name {
            color: #2563eb;
        }


        /* ARROW */

        .arrow {
            font-size: 32px;

            color: #2563eb;
        }


        /* MESSAGE */

        #message {
            text-align: center;

            margin-top: 30px;

            color: #64748b;
        }


        /* FOOTER */

        footer {
            text-align: center;

            padding: 25px;

            color: #64748b;

            font-size: 13px;
        }


        /* MOBILE */

        @media (max-width: 650px) {

            .page-header h1 {
                font-size: 27px;
            }

            .heading-card h2 {
                font-size: 24px;
            }

            .unit-card {
                min-height: 100px;

                padding: 16px;
            }

            .unit-icon {
                width: 60px;
                height: 60px;

                font-size: 27px;
            }

            .unit-number {
                margin-left: 15px;

                font-size: 18px;
            }

            .unit-name {
                margin-left: 12px;

                font-size: 17px;
            }

            .arrow {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


<header class="page-header">

    <h1>
        🎓 CSE IntelliLearn
    </h1>

    <p>
        Learn • Practice • Grow
    </p>

</header>


<main class="container">


    <a
        href="javascript:history.back()"
        class="back-btn">

        ← Back

    </a>


    <section class="heading-card">

        <h2 id="subjectTitle">
            Subject
        </h2>

        <p>
            Select a unit to continue learning.
        </p>

    </section>


    <div id="unitList"></div>


    <div id="message"></div>


</main>


<footer>

    © 2026 CSE IntelliLearn

    <br>

    Learn • Practice • Grow

</footer>


<script>


/* GET DATA FROM URL */

const params =
    new URLSearchParams(
        window.location.search
    );


const subject =
    params.get("subject");


const semester =
    params.get("semester");


/* HTML ELEMENTS */

const subjectTitle =
    document.getElementById(
        "subjectTitle"
    );


const unitList =
    document.getElementById(
        "unitList"
    );


const message =
    document.getElementById(
        "message"
    );


/* CHECK SUBJECT */

if (subject) {

    subjectTitle.innerText =
        subject;


    /*
        CREATE 6 UNITS
    */

    for (
        let unit = 1;
        unit <= 6;
        unit++
    ) {


        const card =
            document.createElement("div");


        card.className =
            "unit-card";


        card.innerHTML = `

            <div class="unit-icon">
                📚
            </div>

            <div class="unit-number">
                Unit ${unit}
            </div>

            <div class="unit-name">
                Unit ${unit} - ${subject}
            </div>

            <div class="arrow">
                →
            </div>

        `;


        /*
            UNIT → TOPICS
        */

        card.onclick =
            function() {

                window.location.href =
                    "unit-topics.html" +
                    "?subject=" +
                    encodeURIComponent(subject) +
                    "&semester=" +
                    encodeURIComponent(semester) +
                    "&unit=" +
                    encodeURIComponent(unit);

            };


        unitList.appendChild(card);

    }

}


/* INVALID SUBJECT */

else {

    message.innerText =
        "No subject selected.";

}


</script>


</body>

</html>
