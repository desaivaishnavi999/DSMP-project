<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSE IntelliLearn - Subjects</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f9ff;
            font-family: Arial, sans-serif;
            color: #12305b;
        }

        .page-header {
            background: linear-gradient(
                135deg,
                #0f3d91,
                #2563eb
            );

            color: white;
            padding: 30px 20px;
            text-align: center;

            box-shadow:
                0 4px 15px
                rgba(37, 99, 235, 0.20);
        }

        .page-header h1 {
            margin: 0;
            font-size: 32px;
        }

        .page-header p {
            margin: 10px 0 0;
            color: #eaf2ff;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px 40px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
        }

        .back-btn:hover {
            color: #0f3d91;
        }

        .heading-card {
            text-align: center;
            background: white;
            padding: 30px 20px;
            border-radius: 18px;
            margin-bottom: 25px;
            border-left: 5px solid #2563eb;

            box-shadow:
                0 5px 20px
                rgba(30, 64, 175, 0.08);
        }

        .heading-card h2 {
            margin: 0;
            font-size: 30px;
            color: #12305b;
        }

        .heading-card p {
            margin: 10px 0 0;
            color: #64748b;
            font-size: 16px;
        }

        .subject-card {
            display: flex;
            align-items: center;

            background: white;

            min-height: 120px;
            margin-bottom: 20px;
            padding: 20px 28px;

            border-radius: 16px;
            border: 1px solid #e1eaf8;

            box-shadow:
                0 5px 18px
                rgba(30, 64, 175, 0.08);

            cursor: pointer;
            transition: 0.2s;
        }

        .subject-card:hover {
            transform: translateY(-3px);
            border-color: #93c5fd;

            box-shadow:
                0 9px 25px
                rgba(30, 64, 175, 0.13);
        }

        .subject-icon {
            width: 80px;
            height: 80px;

            border-radius: 18px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #eaf2ff;

            font-size: 38px;
            flex-shrink: 0;
        }

        .subject-card:hover .subject-icon {
            background: #dbeafe;
        }

        .subject-number {
            margin-left: 30px;
            font-size: 22px;
            font-weight: bold;
            color: #64748b;
        }

        .subject-name {
            margin-left: 22px;
            font-size: 22px;
            font-weight: bold;
            color: #12305b;
            flex: 1;
        }

        .arrow {
            font-size: 32px;
            color: #2563eb;
        }

        .subject-card:hover .subject-name {
            color: #2563eb;
        }

        #message {
            text-align: center;
            margin-top: 30px;
            color: #64748b;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 650px) {

            .page-header h1 {
                font-size: 27px;
            }

            .heading-card h2 {
                font-size: 24px;
            }

            .subject-card {
                min-height: 100px;
                padding: 16px;
            }

            .subject-icon {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }

            .subject-number {
                margin-left: 15px;
                font-size: 18px;
            }

            .subject-name {
                margin-left: 12px;
                font-size: 17px;
            }

            .arrow {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


<header class="page-header">

    <h1>
        🎓 CSE IntelliLearn
    </h1>

    <p>
        Learn • Practice • Grow
    </p>

</header>


<main class="container">


    <a
        href="javascript:history.back()"
        class="back-btn">

        ← Back

    </a>


    <section class="heading-card">

        <h2 id="semesterTitle">
            Semester
        </h2>

        <p>
            Select a subject to continue learning.
        </p>

    </section>


    <div id="subjectList"></div>


    <div id="message"></div>


</main>


<footer>

    © 2026 CSE IntelliLearn
    <br>
    Learn • Practice • Grow

</footer>


<script>


/* GET SEMESTER FROM URL */

const params =
    new URLSearchParams(
        window.location.search
    );

const semester =
    params.get("semester");


/* SUBJECT DATA */

const subjects = {

    1: [
        "Physics",
        "Graphics",
        "Engineering Mathematics-I",
        "Basic Civil Engineering",
        "Basic Electrical Engineering"
    ],

    2: [
        "Engineering Chemistry",
        "Basic Mechanical Engineering",
        "Engineering Mechanics",
        "Basic Electrical Engineering",
        "Engineering Mathematics-II"
    ],

    3: [
        "Data Structure Using C",
        "Computer Network",
        "MDM",
        "Discrete Mathematical Structure",
        "OE"
    ],

    4: [
        "Automata Theory",
        "Operating System",
        "CPP-OOP",
        "Soft Skill",
        "MDM"
    ],

    5: [
        "Subject 1",
        "Subject 2",
        "Subject 3",
        "Subject 4",
        "Subject 5"
    ],

    6: [
        "Subject 1",
        "Subject 2",
        "Subject 3",
        "Subject 4",
        "Subject 5"
    ],

    7: [
        "Subject 1",
        "Subject 2",
        "Subject 3",
        "Subject 4",
        "Subject 5"
    ],

    8: [
        "Subject 1",
        "Subject 2",
        "Subject 3",
        "Subject 4",
        "Subject 5"
    ]

};


/* SEMESTER NAMES */

const semesterNames = {

    1: "Semester 1",
    2: "Semester 2",
    3: "Semester 3",
    4: "Semester 4",
    5: "Semester 5",
    6: "Semester 6",
    7: "Semester 7",
    8: "Semester 8"

};


/* GET HTML ELEMENTS */

const semesterTitle =
    document.getElementById(
        "semesterTitle"
    );

const subjectList =
    document.getElementById(
        "subjectList"
    );

const message =
    document.getElementById(
        "message"
    );


/* DISPLAY SUBJECTS */

if (subjects[semester]) {

    semesterTitle.innerText =
        semesterNames[semester];


    subjects[semester].forEach(
        function(subject, index) {

            const card =
                document.createElement("div");

            card.className =
                "subject-card";


            card.innerHTML = `

                <div class="subject-icon">
                    📘
                </div>

                <div class="subject-number">
                    ${index + 1}.
                </div>

                <div class="subject-name">
                    ${subject}
                </div>

                <div class="arrow">
                    →
                </div>

            `;


            /*
                SUBJECT → TOPICS/UNITS

                Semester information is also
                passed to the next page.
            */

            card.onclick =
                function() {

                    window.location.href =
                        "topics.html?subject=" +
                        encodeURIComponent(subject) +
                        "&semester=" +
                        encodeURIComponent(semester);

                };


            subjectList.appendChild(card);

        }
    );

}


/* INVALID SEMESTER */

else {

    message.innerText =
        "Invalid semester selected.";

}


</script>


</body>

</html>
