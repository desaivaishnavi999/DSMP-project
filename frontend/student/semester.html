<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSE IntelliLearn - Select Semester</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f9ff;
            color: #12305b;
        }

        /* HEADER */

        .page-header {
            background: linear-gradient(
                135deg,
                #0f3d91,
                #2563eb
            );

            color: white;
            padding: 28px 20px;
            text-align: center;

            box-shadow:
                0 4px 15px
                rgba(37, 99, 235, 0.20);
        }

        .page-header h1 {
            margin: 0;
            font-size: 32px;
        }

        .page-header p {
            margin: 10px 0 0;
            color: #eaf2ff;
            font-size: 16px;
        }

        /* MAIN */

        .container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 20px 40px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 25px;

            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        .back-btn:hover {
            color: #0f3d91;
        }

        /* HEADING */

        .heading-card {
            background: white;

            padding: 28px;

            border-radius: 18px;

            text-align: center;

            margin-bottom: 30px;

            border-left: 5px solid #2563eb;

            box-shadow:
                0 5px 20px
                rgba(30, 64, 175, 0.08);
        }

        .heading-card h2 {
            margin: 0;
            font-size: 28px;
            color: #12305b;
        }

        .heading-card p {
            margin: 10px 0 0;
            color: #64748b;
        }

        /* SEMESTER */

        .semester-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .semester-card {
            background: white;

            min-height: 130px;

            padding: 25px 30px;

            border-radius: 18px;

            border: 1px solid #e1eaf8;

            box-shadow:
                0 5px 20px
                rgba(30, 64, 175, 0.08);

            display: flex;

            align-items: center;

            cursor: pointer;

            transition: 0.25s;
        }

        .semester-card:hover {
            transform: translateY(-4px);

            border-color: #93c5fd;

            box-shadow:
                0 10px 28px
                rgba(30, 64, 175, 0.15);
        }

        .semester-icon {
            width: 75px;
            height: 75px;

            border-radius: 16px;

            background: #eaf2ff;

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 34px;

            flex-shrink: 0;
        }

        .semester-card:hover .semester-icon {
            background: #dbeafe;
        }

        .semester-info {
            margin-left: 25px;
            flex: 1;
        }

        .semester-info h3 {
            margin: 0;

            font-size: 23px;

            color: #12305b;
        }

        .semester-info p {
            margin: 8px 0 0;

            color: #64748b;

            font-size: 14px;
        }

        .arrow {
            font-size: 30px;
            color: #2563eb;
        }

        /* MESSAGE */

        #message {
            text-align: center;
            margin-top: 30px;
            color: #64748b;
        }

        /* FOOTER */

        footer {
            text-align: center;

            padding: 25px;

            color: #64748b;

            font-size: 13px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .page-header h1 {
                font-size: 27px;
            }

            .semester-card {
                padding: 20px;
            }

            .semester-icon {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }

            .semester-info {
                margin-left: 15px;
            }

            .semester-info h3 {
                font-size: 19px;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header class="page-header">

    <h1>
        🎓 CSE IntelliLearn
    </h1>

    <p>
        Select your semester
    </p>

</header>



<!-- MAIN -->

<main class="container">


    <a
        href="year.html"
        class="back-btn">

        ← Back to Year

    </a>


    <div class="heading-card">

        <h2 id="yearTitle">
            Select Semester
        </h2>

        <p>
            Choose a semester to view your subjects.
        </p>

    </div>


    <div
        id="semesterList"
        class="semester-list">
    </div>


    <div id="message"></div>


</main>



<footer>

    © 2026 CSE IntelliLearn
    <br>
    Learn • Practice • Grow

</footer>



<script>


/* GET YEAR FROM URL */

const params =
    new URLSearchParams(window.location.search);

const year =
    params.get("year");


/* YEAR DATA */

const yearData = {

    1: {
        title: "First Year",
        semesters: [
            {
                number: 1,
                name: "Semester 1"
            },
            {
                number: 2,
                name: "Semester 2"
            }
        ]
    },

    2: {
        title: "Second Year",
        semesters: [
            {
                number: 3,
                name: "Semester 3"
            },
            {
                number: 4,
                name: "Semester 4"
            }
        ]
    },

    3: {
        title: "Third Year",
        semesters: [
            {
                number: 5,
                name: "Semester 5"
            },
            {
                number: 6,
                name: "Semester 6"
            }
        ]
    },

    4: {
        title: "Final Year",
        semesters: [
            {
                number: 7,
                name: "Semester 7"
            },
            {
                number: 8,
                name: "Semester 8"
            }
        ]
    }

};


/* DISPLAY */

const semesterList =
    document.getElementById("semesterList");

const yearTitle =
    document.getElementById("yearTitle");


if (yearData[year]) {

    yearTitle.innerText =
        yearData[year].title +
        " - Select Semester";


    yearData[year].semesters.forEach(
        function(semester, index) {

            const card =
                document.createElement("div");

            card.className =
                "semester-card";


            card.innerHTML = `

                <div class="semester-icon">
                    ${index === 0 ? "📘" : "📚"}
                </div>

                <div class="semester-info">

                    <h3>
                        ${semester.name}
                    </h3>

                    <p>
                        View subjects and study materials
                    </p>

                </div>

                <div class="arrow">
                    →
                </div>

            `;


            card.onclick =
                function() {

                    window.location.href =
                        "subjects.html?semester=" +
                        semester.number;

                };


            semesterList.appendChild(card);

        }
    );

}

else {

    document.getElementById("message")
        .innerText =
        "Invalid year selected.";

}


</script>


</body>

</html>
