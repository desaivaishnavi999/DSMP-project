<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSE IntelliLearn - PDF Viewer</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f9ff;
            font-family: Arial, sans-serif;
            color: #12305b;
        }

        /* HEADER */

        .page-header {
            background: linear-gradient(
                135deg,
                #0f3d91,
                #2563eb
            );

            color: white;
            padding: 30px 20px;
            text-align: center;

            box-shadow:
                0 4px 15px
                rgba(37, 99, 235, 0.20);
        }

        .page-header h1 {
            margin: 0;
            font-size: 32px;
        }

        .page-header p {
            margin: 10px 0 0;
            color: #eaf2ff;
        }


        /* CONTAINER */

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px 40px;
        }


        /* BACK */

        .back-btn {
            display: inline-block;

            margin-bottom: 20px;

            color: #2563eb;

            text-decoration: none;

            font-size: 17px;

            font-weight: bold;
        }

        .back-btn:hover {
            color: #0f3d91;
        }


        /* TOPIC INFO */

        .topic-info {
            background: white;

            padding: 28px 20px;

            border-radius: 18px;

            text-align: center;

            border-left: 5px solid #2563eb;

            box-shadow:
                0 5px 20px
                rgba(30, 64, 175, 0.08);

            margin-bottom: 25px;
        }

        .topic-info h2 {
            margin: 0;

            font-size: 28px;

            color: #12305b;
        }

        .topic-info p {
            margin: 10px 0 0;

            color: #64748b;
        }


        /* INFO TAGS */

        .info-box {
            display: flex;

            justify-content: center;

            gap: 10px;

            flex-wrap: wrap;

            margin-top: 18px;
        }

        .info-tag {
            background: #eaf2ff;

            color: #2563eb;

            padding: 8px 15px;

            border-radius: 20px;

            font-size: 14px;

            font-weight: bold;
        }


        /* PDF SECTION */

        .pdf-card {
            background: white;

            padding: 25px;

            border-radius: 18px;

            box-shadow:
                0 5px 20px
                rgba(30, 64, 175, 0.08);
        }


        .pdf-card h3 {
            margin-top: 0;

            color: #12305b;

            font-size: 22px;
        }


        /* PDF BUTTON */

        .pdf-button {
            display: inline-block;

            padding: 12px 22px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            border-radius: 10px;

            font-weight: bold;

            margin-bottom: 20px;

            transition: 0.2s;
        }

        .pdf-button:hover {
            background: #0f3d91;
        }


        /* PDF VIEWER */

        .pdf-frame {
            width: 100%;

            height: 650px;

            border: 1px solid #dbe5f2;

            border-radius: 12px;

            background: #f8fbff;
        }


        /* MESSAGE */

        #message {
            text-align: center;

            color: #64748b;

            margin-top: 30px;
        }


        /* FOOTER */

        footer {
            text-align: center;

            padding: 25px;

            color: #64748b;

            font-size: 13px;
        }


        /* MOBILE */

        @media (max-width: 650px) {

            .page-header h1 {
                font-size: 27px;
            }

            .topic-info h2 {
                font-size: 23px;
            }

            .pdf-card {
                padding: 15px;
            }

            .pdf-frame {
                height: 500px;
            }

        }

    </style>

</head>


<body>


<header class="page-header">

    <h1>
        🎓 CSE IntelliLearn
    </h1>

    <p>
        Learn • Practice • Grow
    </p>

</header>


<main class="container">


    <a
        href="javascript:history.back()"
        class="back-btn">

        ← Back

    </a>


    <!-- TOPIC INFORMATION -->

    <section class="topic-info">

        <h2 id="topicTitle">
            Topic Notes
        </h2>

        <p>
            Study the notes for the selected topic.
        </p>

        <div class="info-box">

            <div
                class="info-tag"
                id="subjectInfo">

                Subject

            </div>

            <div
                class="info-tag"
                id="semesterInfo">

                Semester

            </div>

            <div
                class="info-tag"
                id="unitInfo">

                Unit

            </div>

        </div>

    </section>


    <!-- PDF -->

    <section class="pdf-card">

        <h3>
            📚 Topic Notes PDF
        </h3>


        <a
            id="openPdf"
            class="pdf-button"
            href="#"
            target="_blank">

            📄 Open PDF

        </a>


        <iframe
            id="pdfViewer"
            class="pdf-frame"
            title="PDF Viewer">
        </iframe>


    </section>


    <div id="message"></div>


</main>


<footer>

    © 2026 CSE IntelliLearn

    <br>

    Learn • Practice • Grow

</footer>


<script>


/* GET DATA FROM URL */

const params =
    new URLSearchParams(
        window.location.search
    );


const subject =
    params.get("subject");


const semester =
    params.get("semester");


const unit =
    params.get("unit");


const topic =
    params.get("topic");


/* HTML ELEMENTS */

const topicTitle =
    document.getElementById(
        "topicTitle"
    );


const subjectInfo =
    document.getElementById(
        "subjectInfo"
    );


const semesterInfo =
    document.getElementById(
        "semesterInfo"
    );


const unitInfo =
    document.getElementById(
        "unitInfo"
    );


const pdfViewer =
    document.getElementById(
        "pdfViewer"
    );


const openPdf =
    document.getElementById(
        "openPdf"
    );


const message =
    document.getElementById(
        "message"
    );


/*
    DEMO PDF

    Later this URL will come
    from Cloudinary / Database.
*/

const pdfUrl =
    "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf";


/* CHECK DATA */

if (
    subject &&
    semester &&
    unit &&
    topic
) {

    topicTitle.innerText =
        topic;

    subjectInfo.innerText =
        subject;

    semesterInfo.innerText =
        "Semester " + semester;

    unitInfo.innerText =
        "Unit " + unit;


    /*
        LOAD PDF
    */

    pdfViewer.src =
        pdfUrl;


    openPdf.href =
        pdfUrl;


    /*
        SAVE DATA
    */

    localStorage.setItem(
        "selectedSubject",
        subject
    );

    localStorage.setItem(
        "selectedSemester",
        semester
    );

    localStorage.setItem(
        "selectedUnit",
        unit
    );

    localStorage.setItem(
        "selectedTopic",
        topic
    );

    localStorage.setItem(
        "selectedPdf",
        pdfUrl
    );

}


/* INVALID DATA */

else {

    message.innerText =
        "Topic information not found.";

}


</script>


</body>

</html>
